<script>
// Filet de sécurité : si une erreur bloque le script avant même son
// initialisation normale, on l'affiche clairement au lieu de laisser
// une page vide ou un message générique illisible.
window.addEventListener('error', (e) => {
  const el = document.getElementById('nights');
  if(el){
    el.innerHTML = `<div class="empty-state">Erreur au chargement de l'app :<br><b>${(e && e.message) ? e.message : 'erreur inconnue'}</b><br><small>${e.filename ? e.filename.split('/').pop() : ''}${e.lineno ? ':'+e.lineno : ''}</small></div>`;
  }
});

const MAX_PRESENT = 10;
const SUITS = "♥️ ♣️ ♦️ ♠️";
let myName = "";
let nameSaveTimer = null;

// ---------- storage helpers ----------
// ⚠️ Remplace cette URL par celle de TA base Firebase Realtime Database
// (tu l'obtiens dans la console Firebase, voir instructions fournies séparément)
const FIREBASE_DB_URL = "https://monday-poker-default-rtdb.firebaseio.com";
try{
  firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
}catch(e){
  console.error('Échec de l\'initialisation Firebase :', e);
}

function getPersonal(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}
function setPersonal(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ console.error(e); }
}
function getPersonal(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}
function setPersonal(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ console.error(e); }
}

// Écriture simple (sans risque de conflit : chaque soirée a son propre nœud,
// donc créer une soirée n'écrase jamais celle d'une autre).
async function markPollExists(dateKey){
  try{
    await firebase.database().ref(`polls/${dateKey}`).set(true);
  }catch(e){ console.error(e); }
}

async function listPollDates(){
  try{
    const snap = await firebase.database().ref('polls').once('value');
    const val = snap.val();
    return val ? Object.keys(val) : [];
  }catch(e){ console.error(e); return []; }
}

async function getPollData(dateKey){
  try{
    const snap = await firebase.database().ref(`data/${dateKey}`).once('value');
    return snap.val() || {present:[], waitlist:[], absent:[]};
  }catch(e){ console.error(e); return {present:[], waitlist:[], absent:[]}; }
}

// Modification atomique : Firebase relit la donnée la plus récente et
// réessaie automatiquement en cas d'écriture concurrente, donc deux
// personnes qui s'inscrivent en même temps ne peuvent plus s'écraser
// l'une l'autre ni créer de doublons.
async function updatePollData(dateKey, updater){
  const ref = firebase.database().ref(`data/${dateKey}`);
  const result = await ref.transaction((current) => {
    const data = current || {present:[], waitlist:[], absent:[]};
    if(!data.present) data.present = [];
    if(!data.waitlist) data.waitlist = [];
    if(!data.absent) data.absent = [];
    return updater(data);
  });
  return result.snapshot.val();
}

// ---------- migration (une seule fois) ----------
// Convertit automatiquement les données enregistrées avec l'ancien système
// de stockage vers le nouveau format, sans rien perdre. Un verrou garantit
// qu'un seul appareil fait la conversion même si plusieurs personnes
// ouvrent l'app en même temps juste après la mise à jour.
async function migrateOldDataIfNeeded(){
  try{
    const lockRef = firebase.database().ref('migration-v2-done');
    const lockResult = await lockRef.transaction(current => {
      if(current) return undefined; // déjà migré (ou en cours) ailleurs : on abandonne
      return true;
    });
    if(!lockResult.committed) return;

    const oldIndexSnap = await firebase.database().ref('polls-index').once('value');
    const oldIndexRaw = oldIndexSnap.val();
    if(!oldIndexRaw) return; // rien à migrer

    let oldKeys = [];
    try{ oldKeys = JSON.parse(oldIndexRaw); }catch(e){ oldKeys = []; }

    for(const k of oldKeys){
      const dateKey = k.replace('poll:','');
      const oldDataSnap = await firebase.database().ref(`data:${dateKey}`).once('value');
      const raw = oldDataSnap.val();
      let data = {present:[], waitlist:[], absent:[]};
      if(raw){
        try{ data = JSON.parse(raw); }catch(e){}
      }
      await firebase.database().ref(`polls/${dateKey}`).set(true);
      await firebase.database().ref(`data/${dateKey}`).set(data);
    }

    // Nettoyage des anciennes clés une fois la copie terminée
    await firebase.database().ref('polls-index').remove();
    for(const k of oldKeys){
      const dateKey = k.replace('poll:','');
      await firebase.database().ref(`data:${dateKey}`).remove();
    }
  }catch(e){
    console.error('Migration échouée (non bloquant) :', e);
  }
}

// ---------- date generation ----------
// Renvoie tous les lundis 20h00 d'un mois donné (0-indexed month)
function mondaysOfMonth(year, month){
  const result = [];
  const d = new Date(year, month, 1);
  while(d.getMonth() === month){
    if(d.getDay() === 1){
      const night = new Date(year, month, d.getDate(), 20, 0, 0);
      result.push(night);
    }
    d.setDate(d.getDate() + 1);
  }
  return result;
}

function pollKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function formatTitle(date){
  const dateStr = date.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  return `${dateStr.charAt(0).toUpperCase()}${dateStr.slice(1)} 20:00`;
}

function formatTs(ts){
  const d = new Date(ts);
  const date = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
  const time = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  return `Inscrit le ${date} à ${time}`;
}

// Simule la génération automatique fin de mois : on s'assure que le mois
// courant et le mois suivant ont toujours leurs soirées prêtes.
// Chaque soirée vit dans son propre nœud Firebase, donc la créer n'écrase
// jamais celles déjà créées par quelqu'un d'autre (fini les doublons).
async function ensurePollsExist(){
  const today = new Date();
  const months = [
    {y: today.getFullYear(), m: today.getMonth()},
    {y: today.getMonth() === 11 ? today.getFullYear()+1 : today.getFullYear(), m: (today.getMonth()+1) % 12}
  ];

  const existing = new Set(await listPollDates());

  for(const {y,m} of months){
    for(const date of mondaysOfMonth(y,m)){
      const key = pollKey(date);
      if(!existing.has(key)){
        await markPollExists(key);
        existing.add(key);
      }
    }
  }
  return Array.from(existing);
}

function removeFromAll(data, name){
  data.present = data.present.filter(p => p.name.toLowerCase() !== name.toLowerCase());
  data.waitlist = data.waitlist.filter(p => p.name.toLowerCase() !== name.toLowerCase());
  data.absent = data.absent.filter(p => p.name.toLowerCase() !== name.toLowerCase());
}

// ---------- rendering ----------
// Verrou : empêche deux rafraîchissements de tourner en même temps
// (c'est ce qui causait les doublons de cartes lors d'un vote, car le
// vote lui-même ET la notification temps réel déclenchaient chacun un
// rendu en parallèle).
let renderInProgress = false;
let renderAgainRequested = false;

async function renderAll(){
  if(renderInProgress){
    renderAgainRequested = true;
    return;
  }
  renderInProgress = true;
  try{
    await renderAllInner();
  } finally {
    renderInProgress = false;
    if(renderAgainRequested){
      renderAgainRequested = false;
      renderAll();
    }
  }
}

async function renderAllInner(){
  const container = document.getElementById('nights');
  const footer = document.getElementById('footerNote');
  container.innerHTML = '<div class="empty-state">Chargement des soirées…</div>';

  let index;
  try{
    index = await ensurePollsExist();
  }catch(e){
    container.innerHTML = `<div class="empty-state">Erreur technique (diagnostic) :<br>${escapeHtml(String(e && e.message ? e.message : e))}</div>`;
    return;
  }

  if(!Array.isArray(index)){
    container.innerHTML = `<div class="empty-state">Diagnostic : ensurePollsExist n'a pas renvoyé de liste valide (${escapeHtml(String(index))}).</div>`;
    return;
  }

  const now = new Date();
  const upcoming = index
    .filter(k => {
      const [y,m,d] = k.split('-').map(Number);
      const dt = new Date(y, m-1, d, 22, 0, 0); // reste affiché jusqu'à 22h le soir même
      return dt >= now;
    })
    .sort(); // format AAAA-MM-JJ : le tri alphabétique = tri chronologique

  if(upcoming.length === 0){
    container.innerHTML = `<div class="empty-state">Aucune soirée à venir pour le moment.<br><small>(diag-1 : ${index.length} soirée(s) trouvée(s) au total en base)</small></div>`;
    return;
  }

  container.innerHTML = '';
  for(const dateKey of upcoming){
    const [y,m,d] = dateKey.split('-').map(Number);
    const date = new Date(y, m-1, d, 20, 0, 0);
    const data = await getPollData(dateKey);
    container.appendChild(buildCard(dateKey, date, data));
  }

  footer.textContent = `Les soirées sont générées automatiquement pour le mois en cours et le mois suivant. (build diag-1)`;
}

function buildCard(dateKey, date, data){
  const card = document.createElement('div');
  card.className = 'night-card';

  const isFull = data.present.length >= MAX_PRESENT;
  const myVote = getMyVote(data);

  card.innerHTML = `
    <div class="suits-row">${SUITS}</div>
    <h2>${formatTitle(date)}</h2>
    <div class="subline">Soirée poker hebdomadaire</div>

    <div class="capacity">
      <div class="bar"><div class="bar-fill" style="width:${Math.min(100,(data.present.length/MAX_PRESENT)*100)}%"></div></div>
      <div class="count">${data.present.length}/${MAX_PRESENT} présents${isFull ? '<span class="full-badge">Complet</span>' : ''}</div>
    </div>

    <div class="vote-row">
      <button class="vote-btn present ${myVote==='present'?'active-vote':''}" data-action="present">Présent</button>
      <button class="vote-btn wait ${myVote==='waitlist'?'active-vote':''}" data-action="waitlist">Liste d'attente</button>
      <button class="vote-btn absent ${myVote==='absent'?'active-vote':''}" data-action="absent">Absent</button>
    </div>

    <div class="notice" data-notice></div>

    ${listSection('Présents', data.present, true)}
    ${listSection("Liste d'attente", data.waitlist, false)}
    ${listSection('Absents', data.absent, false)}
  `;

  card.querySelectorAll('.vote-btn').forEach(btn => {
    btn.addEventListener('click', () => handleVote(dateKey, btn.dataset.action, card));
  });

  card.querySelectorAll('[data-unreg]').forEach(btn => {
    btn.addEventListener('click', () => handleUnregister(dateKey, btn.dataset.unreg, card));
  });

  return card;
}

function getMyVote(data){
  if(!myName) return null;
  const n = myName.toLowerCase();
  if(data.present.some(p=>p.name.toLowerCase()===n)) return 'present';
  if(data.waitlist.some(p=>p.name.toLowerCase()===n)) return 'waitlist';
  if(data.absent.some(p=>p.name.toLowerCase()===n)) return 'absent';
  return null;
}

function listSection(title, people, numbered){
  if(people.length === 0){
    return `<div class="list-section"><h3>${title} (0)</h3><div class="empty-line">Personne pour l'instant</div></div>`;
  }
  const rows = people.map((p, i) => {
    const canUnreg = myName && p.name.toLowerCase() === myName.toLowerCase();
    return `
      <div class="person-row">
        <div class="who">
          ${numbered ? `<span class="idx">${i+1}</span>` : ''}
          <span class="name">${escapeHtml(p.name)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="ts">${formatTs(p.ts)}</span>
          ${canUnreg ? `<button class="unreg" data-unreg="${escapeHtml(p.name)}">Se désinscrire</button>` : ''}
        </div>
      </div>`;
  }).join('');
  return `<div class="list-section"><h3>${title} (${people.length})</h3>${rows}</div>`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- actions ----------
async function handleVote(dateKey, action, cardEl){
  if(!myName){
    document.getElementById('nameInput').focus();
    document.getElementById('nameInput').style.borderColor = 'var(--red)';
    setTimeout(()=>{ document.getElementById('nameInput').style.borderColor = ''; }, 1200);
    return;
  }

  const notice = cardEl.querySelector('[data-notice]');
  notice.classList.remove('show');

  let wentToWaitlist = false;
  const nameAtClick = myName;

  await updatePollData(dateKey, (data) => {
    removeFromAll(data, nameAtClick);
    const entry = { name: nameAtClick, ts: Date.now() };

    if(action === 'present'){
      if(data.present.length < MAX_PRESENT){
        data.present.push(entry);
      } else {
        data.waitlist.push(entry);
        wentToWaitlist = true;
      }
    } else if(action === 'waitlist'){
      data.waitlist.push(entry);
    } else if(action === 'absent'){
      data.absent.push(entry);
    }
    return data;
  });

  if(wentToWaitlist){
    notice.textContent = "Complet : tu as été placé(e) en liste d'attente.";
    notice.classList.add('show');
  }

  await renderAll();
}

async function handleUnregister(dateKey, name, cardEl){
  await updatePollData(dateKey, (data) => {
    removeFromAll(data, name);
    // Promeut le premier de la liste d'attente si une place se libère
    if(data.present.length < MAX_PRESENT && data.waitlist.length > 0){
      data.present.push(data.waitlist.shift());
    }
    return data;
  });

  await renderAll();
}

// ---------- name handling ----------
async function initName(){
  const saved = await getPersonal('my-name');
  if(saved){
    myName = saved;
    document.getElementById('nameInput').value = saved;
  }
}

document.getElementById('nameInput').addEventListener('input', (e) => {
  myName = e.target.value.trim();
  const status = document.getElementById('nameStatus');
  status.classList.remove('show');
  clearTimeout(nameSaveTimer);
  nameSaveTimer = setTimeout(async () => {
    await setPersonal('my-name', myName);
    status.classList.add('show');
    setTimeout(()=>status.classList.remove('show'), 1500);
    await renderAll();
  }, 500);
});

// ---------- init ----------
(async function init(){
  await initName();
  await migrateOldDataIfNeeded();
  await renderAll();
})();

// Écoute Firebase en temps réel : dès qu'une inscription change
// (la tienne ou celle de quelqu'un d'autre), l'app se met à jour
// instantanément, sans délai et sans vérification périodique.
let liveRef = null;
let firstSnapshot = true;

function startListening(){
  if(liveRef) return;
  try{
    liveRef = firebase.database().ref();
    liveRef.on('value', () => {
      if(firstSnapshot){ firstSnapshot = false; return; } // évite un doublon avec le rendu initial
      renderAll();
    });
  }catch(e){
    console.error('Écoute temps réel indisponible :', e);
  }
}
function stopListening(){
  if(liveRef){ liveRef.off(); liveRef = null; }
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    renderAll();
    firstSnapshot = true;
    startListening();
  } else {
    stopListening();
  }
});

startListening();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
